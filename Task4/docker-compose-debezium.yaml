services:
  # ============ CRM База (Postgres) - на порту 5444 ============
  crm_db: 
    image: postgres:14
    container_name: crm_db
    environment:
      POSTGRES_DB: crm_db
      POSTGRES_USER: crm_user
      POSTGRES_PASSWORD: crm_password
    ports:
      - "5444:5432"
    volumes:
        - ./crm-init:/docker-entrypoint-initdb.d
        - ./crm-postgres-data:/var/lib/postgresql/data
    #для работы с debezium - не использовать decoderbufs (дляне го нужен другой image)
    command: >
      postgres -c wal_level=logical
               -c max_replication_slots=10
               -c max_wal_senders=10
               -c shared_preload_libraries='pg_stat_statements'
    networks:
      - data_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm_user -d crm_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============ Kafka ============
  # ZooKeeper for Kafka
  zookeeper:
    image: wurstmeister/zookeeper:latest
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      #ZOOKEEPER_TICK_TIME: 2000
    networks:
      - data_network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  #Kafka itself
  kafka:
    image: wurstmeister/kafka:2.13-2.7.0
    container_name: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      #KAFKA_CREATE_TOPICS: "movie-events:1:1,user-events:1:1,payment-events:1:1"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "9092"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - data_network
  

  # ============ Debezium to Kafka Connect ============
  debezium-kafka:
    image: debezium/connect:2.5
    container_name: debezium-kafka
    depends_on:
      kafka:
        condition: service_healthy
      crm_db:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
      CONNECT_PLUGIN_PATH: /kafka/connect
      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_KEY_CONVERTER_SCHEMA_ENABLE: false
      CONNECT_VALUE_CONVERTER_SCHEMA_ENABLE: false
      CONNECT_REST_ADVERTISED_HOST_NAME: debezium-kafka
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_CONNECTOR_CLIENT_CONFIG_OVERRIDE_POLICY: All
    ports:
      - "8083:8083"
    volumes:
      - ./debezium:/kafka/connect/debezium-connector
      - ./debezium/config:/etc/debezium/config
    networks:
      - data_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/connectors"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
  
  # Автоматическая регистрация коннектора
  connector-init:
    image: curlimages/curl:latest
    container_name: connector-init
    entrypoint: |
      /bin/sh -c "
        echo 'Waiting for Debezium Connect to be ready...';
        until curl -f http://debezium-kafka:8083/; do
          echo 'Connect not ready yet, waiting...';
          sleep 2;
        done;
        echo 'Connect ready, registering connector...';
        curl -X POST -H 'Content-Type: application/json' --data @/config/postgress-connector.json http://debezium-kafka:8083/connectors
      "
    volumes:
      - ./debezium/config/postgress-connector.json:/config/postgress-connector.json
    networks:
      - data_network
    depends_on:
      debezium-kafka:
        condition: service_healthy

  # ============ ClickHouse ============
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse
    ports:
      - "8123:8123" #HTTP
      - "9431:9000" #Native
    environment:
      CLICKHOUSE_PASSWORD: default #без этого default user has no network access
    volumes:
      - ./clickhouse-data:/var/lib/clickhouse
      - ./clickhouse_init:/docker-entrypoint-initdb.d
    networks:
      - data_network
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ============ Kafka UI ============
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: connect
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://kafka-connect:8083
    ports:
      - "8080:8080"
    networks:
      - data_network


networks:
  data_network:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
  clickhouse_data:
  nginx_cache: