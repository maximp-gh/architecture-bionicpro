
services:
  keycloak_db:
    image: postgres:14
    environment:
      POSTGRES_DB: keycloak_db
      POSTGRES_USER: keycloak_user
      POSTGRES_PASSWORD: keycloak_password
    volumes:
      - ./postgres-keycloak-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
  keycloak:
    image: quay.io/keycloak/keycloak:21.1
    environment:
      KEYCLOAK_FRONTEND_URL: "http://localhost:8080"
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak_db:5432/keycloak_db
      KC_DB_USERNAME: keycloak_user
      KC_DB_PASSWORD: keycloak_password
    command: 
      - start-dev
      - --import-realm
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    ports:
      - "8080:8080"
    depends_on:
      - keycloak_db
  frontend:
    build:
      context: ./frontend
      #context: ./frontend_pkce
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://reports:3002
      REACT_APP_KEYCLOAK_URL: http://keycloak:8080
      REACT_APP_KEYCLOAK_REALM: reports-realm
      REACT_APP_KEYCLOAK_CLIENT_ID: reports-frontend
  bionicpro-auth:
    build:
      context: ./bionicpro-auth
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      SRV_API_URL: http://localhost:8000
      SRV_KEYCLOAK_URL: http://keycloak:8080
      SRV_KEYCLOAK_REALM: reports-realm
      SRV_KEYCLOAK_CLIENT_ID: reports-frontend
      SRV_KEYCLOAK_CLIENT_SECRET: Af8IQyJHOLYCADRIeT3Fq2aIQ5QI9hjd
      FRONTEND_URL: http://localhost:3000

  openldap:
    image: osixia/openldap:latest
    container_name: openldap
    environment:
      LDAP_BASE_DN: "dc=example,dc=com"
      LDAP_ORGANISATION: "Example Organization"
      LDAP_DOMAIN: "example.com"
      LDAP_ADMIN_PASSWORD: "admin"
      LDAP_TLS: "false"             # deactivate TLS for the LDAP server
    volumes:
      - ./ldap/config.ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom/50-bootstrap.ldif
  #  networks:
  #    - ldap_network
    ports:
      - "389:389"                   # default port for unsecured LDAP
    command: --copy-service
    restart: unless-stopped
  phpldapadmin:
    image: osixia/phpldapadmin:latest
    container_name: phpldapadmin
    environment:
      PHPLDAPADMIN_LDAP_HOSTS: openldap
      PHPLDAPADMIN_HTTPS: "false"   # deactivate HTTPS
    #networks:
    #  - ldap_network
    ports:
      - "8081:80"
    restart: unless-stopped
    depends_on:
      - openldap
  reports:
    build:
      context: ./reports
      dockerfile: Dockerfile
    ports:
      - "3002:3002"
    environment:
      OAUTH_BACKEND_URL: http://bionicpro-auth:3001
  olap_db:
    image: clickhouse/clickhouse-server:latest
    ports:
      - "8123:8123"
      - "9431:9000"
    environment:
      CLICKHOUSE_PASSWORD: default #без этого default user has no network access
    volumes:
      - ./clickhouse-data:/var/lib/clickhouse
      - ./olap-db:/docker-entrypoint-initdb.d
      - ./olap-db:/var/lib/clickhouse/user_files
      - ./olap-db/users.xml:/etc/clickhouse-server/users.d/users.xml
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1'"]
      interval: 1s
      timeout: 3s
      retries: 30
  nginx-cdn:
    image: nginx:alpine
    volumes:
      - ./Task3/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./nginx_cache:/var/cache/nginx/
    ports:
      - "8090:80"
    depends_on:
      - minio
  minio:
    image: minio/minio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_storage:/data
    environment:
      MINIO_ROOT_USER: minio_user
      MINIO_ROOT_PASSWORD: minio_password
    command: server --console-address ":9001" /data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  init-minio:
    image: minio/minio
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      echo '⏳ Waiting for MinIO...';
      sleep 5;
      
      echo '🔑 Setting up alias...';
      mc alias set local http://minio:9000 minio_user minio_password;
      
      echo '📦 Creating bucket...';
      mc mb local/reports-bucket || echo 'Bucket already exists';
      
      echo '🌍 Setting bucket to PUBLIC...';
      mc anonymous set public local/reports-bucket;
      
      echo '✅ Done!';
      echo '   Bucket: reports-bucket';
      echo '   Access: public';
      echo '   URL: http://localhost:9000/reports-bucket/';
      exit 0;
      "
volumes:
  minio_storage: {}